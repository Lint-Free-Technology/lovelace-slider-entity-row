name: Visual tests

on:
  workflow_dispatch:

permissions: {}

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    env:
      HA_VERSION: "2026.5.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install JS dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          playwright install --with-deps chromium

      - name: Run visual tests
        run: pytest tests/visual/test_scenarios.py

      - name: Run doc image tests
        run: pytest tests/visual/test_doc_images.py
