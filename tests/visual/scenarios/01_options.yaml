          - hide_when_off + toggle\n- full_row\n- full_row + hide_when_off\n- full_row\
          \ + toggle\n- full_row + hide_state\n\n```\n- &default\n  type: custom:slider-entity-row\n\
          \  entity: light.bed_light\n- <<: *default\n  name: toggle\n  toggle: true\n\
