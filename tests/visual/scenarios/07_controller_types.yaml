      entity: cover.living_room_window
    - type: custom:slider-entity-row
      entity: fan.ceiling_fan
    - type: custom:slider-entity-row
      entity: input_number.slider
    - type: custom:slider-entity-row
      entity: input_select.select
    - type: custom:slider-entity-row
      entity: number.temperature_setting
    - type: custom:slider-entity-row
      entity: humidifier.humidifier
